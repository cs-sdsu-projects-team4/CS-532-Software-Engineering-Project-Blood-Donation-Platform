# Local development stack: PostgreSQL+PostGIS and the Go API.
# Values come from deploy/.env (copy it from deploy/.env.example first).
#
#   docker compose up -d        start in the background
#   docker compose logs -f api  follow API logs
#   docker compose down         stop (add -v to also wipe the db volume)

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blood}
      POSTGRES_DB: ${POSTGRES_DB:-blooddb}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blood} -d ${POSTGRES_DB:-blooddb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      APP_ENV: ${APP_ENV:-development}
      # Inside the compose network the database host is "db", not "localhost".
      DATABASE_URL: postgres://${POSTGRES_USER:-blood}:${POSTGRES_PASSWORD:-blood}@db:5432/${POSTGRES_DB:-blooddb}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
