openapi: 3.0.3
info:
  title: Blood Donation Coordination API
  version: 0.5.0
  description: >
    REST contract for the Blood Donation Coordination App. Covers the
    account/access foundation (donor registration, JWT auth, profiles, screening —
    FR-01..04, FR-12) and the request/matching workflow: clinic blood requests
    with a clinic_admin approval gate (FR-05/06), the deterministic matching
    pipeline (FR-07/08), push notifications (FR-09), donor accept/decline (FR-10),
    appointment scheduling with no double-booking (FR-11), and the audit log
    (FR-13).
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: health
  - name: auth
  - name: donor
  - name: screening
  - name: requests
  - name: matches
  - name: appointments
  - name: notifications
  - name: admin

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is up
  /readyz:
    get:
      tags: [health]
      summary: Readiness probe (checks the database)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a donor account (FR-01)
      description: >
        Self-registration for donors only. Requires an 18-or-older declaration.
        No national ID is collected. Returns the new account and a token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: The authenticated caller's account
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/donor/profile:
    get:
      tags: [donor]
      summary: Get the caller's donor profile
      responses:
        "200":
          description: Donor profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DonorProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [donor]
      summary: Update the caller's donor profile (FR-02)
      description: >
        Partial update. Only the fields present are changed. latitude and
        longitude must be supplied together.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DonorProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/screening/questions:
    get:
      tags: [screening]
      summary: The preliminary screening questionnaire (FR-03)
      responses:
        "200":
          description: Questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items: { $ref: "#/components/schemas/ScreeningQuestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/screening:
    post:
      tags: [screening]
      summary: Submit screening answers (FR-03, FR-04)
      description: >
        Stores the donor's yes/no answers and returns NON-DIAGNOSTIC guidance.
        The response never states an eligibility decision; the clinic decides in
        person.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScreeningRequest" }
      responses:
        "201":
          description: Stored, with guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScreeningResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/screening/me:
    get:
      tags: [screening]
      summary: The caller's latest screening state
      responses:
        "200":
          description: Latest screening
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScreeningResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/requests:
    post:
      tags: [requests]
      summary: Create a blood request (FR-05)
      description: >
        Clinic staff (clinic_employee or clinic_admin) create a request for their
        own clinic. It starts at pending_approval and is not matched until a
        clinic_admin approves it. blood_type must be one of the 8 concrete types.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRequest" }
      responses:
        "201":
          description: Request created (pending approval)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BloodRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [requests]
      summary: List the caller's clinic's requests
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BloodRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/requests/{id}:
    get:
      tags: [requests]
      summary: Get one request owned by the caller's clinic
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BloodRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/requests/{id}/approve:
    post:
      tags: [requests]
      summary: Approve a request and run matching (FR-06)
      description: >
        clinic_admin only. Flips the request to approved and runs the
        deterministic matching pipeline, returning the number of donors matched.
        Approving a request that is not pending returns 409.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Approved, with matched count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproveResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Request is not pending approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/requests/{id}/cancel:
    post:
      tags: [requests]
      summary: Cancel a request (clinic staff)
      description: Allowed from pending_approval or approved; terminal states return 409.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BloodRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Request cannot be cancelled in its current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/requests/{id}/fulfill:
    post:
      tags: [requests]
      summary: Mark a request fulfilled (clinic staff)
      description: Allowed only from the approved state; otherwise 409.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BloodRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Request is not in a fulfillable state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/requests/{id}/matches:
    get:
      tags: [matches]
      summary: Donors matched to a request, with contact details
      parameters:
        - { $ref: "#/components/parameters/IdParam" }
        - { $ref: "#/components/parameters/LimitParam" }
        - { $ref: "#/components/parameters/OffsetParam" }
      responses:
        "200":
          description: Matches (nearest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RequestMatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/donor/matches:
    get:
      tags: [matches]
      summary: The caller's matches with request context (FR-10)
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DonorMatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/donor/matches/{id}/respond:
    post:
      tags: [matches]
      summary: Accept or decline a match (FR-10)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RespondRequest" }
      responses:
        "200":
          description: Response recorded
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Match is not awaiting a response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/donor/matches/{id}/appointment:
    post:
      tags: [appointments]
      summary: Book an appointment for an accepted match (FR-11)
      description: >
        The donor must have accepted the match. The chosen slot is rejected with
        409 if it double-books the donor or the clinic.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookRequest" }
      responses:
        "201":
          description: Appointment booked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Slot taken or match not accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/donor/appointments:
    get:
      tags: [appointments]
      summary: The caller's appointments
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/donor/appointments/{id}:
    patch:
      tags: [appointments]
      summary: Cancel the caller's appointment
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/appointments:
    get:
      tags: [appointments]
      summary: Appointments at the caller's clinic (clinic staff)
      responses:
        "200":
          description: Appointments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/appointments/{id}:
    patch:
      tags: [appointments]
      summary: Record an appointment outcome (clinic staff)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentStatusUpdate" }
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/donor/push-tokens:
    post:
      tags: [notifications]
      summary: Register an FCM device token (FR-09)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushTokenRequest" }
      responses:
        "201":
          description: Token registered
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [notifications]
      summary: Unregister a device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204":
          description: Token removed
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/clinics:
    post:
      tags: [admin]
      summary: Create a clinic (system_admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClinic" }
      responses:
        "201":
          description: Clinic created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Clinic" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [admin]
      summary: List all clinics (system_admin)
      responses:
        "200":
          description: Clinics
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Clinic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/clinics/{id}:
    get:
      tags: [admin]
      summary: Get a clinic (system_admin)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Clinic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Clinic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/clinics/{id}/members:
    post:
      tags: [admin]
      summary: Provision a clinic-staff account (system_admin)
      description: >
        Creates a clinic_employee or clinic_admin user and attaches them to the
        clinic in one transaction. Clinic staff never self-register.
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMember" }
      responses:
        "201":
          description: Staff account created and attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClinicMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [admin]
      summary: List a clinic's staff (system_admin)
      parameters: [{ $ref: "#/components/parameters/IdParam" }]
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClinicMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/activity:
    get:
      tags: [admin]
      summary: Audit feed (system_admin, FR-13)
      description: >
        Most recent activity, or a single entity's history when both entity_type
        and entity_id are supplied.
      parameters:
        - name: entity_type
          in: query
          required: false
          schema: { type: string }
        - name: entity_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          required: false
          description: max rows when not filtering by entity (default 50, max 200)
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          description: Activity entries (newest first)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityLog" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  security:
    - bearerAuth: []

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid credentials/token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted for this role (FR-12)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Positive integer resource id
      schema: { type: integer, format: int64, minimum: 1 }
    LimitParam:
      name: limit
      in: query
      required: false
      description: Max rows to return (default 50, max 200)
      schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Rows to skip for pagination (default 0)
      schema: { type: integer, default: 0, minimum: 0 }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: invalid_request }
            message: { type: string }
    BloodType:
      type: string
      enum: ["O-","O+","A-","A+","B-","B+","AB-","AB+","unknown"]
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, format: email }
        role: { type: string, enum: [donor, clinic_employee, clinic_admin, system_admin] }
        full_name: { type: string }
        phone: { type: string, nullable: true }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: access-token lifetime in seconds }
    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        tokens: { $ref: "#/components/schemas/TokenPair" }
    RegisterRequest:
      type: object
      required: [email, password, full_name, age_18_or_older]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        full_name: { type: string }
        phone: { type: string }
        blood_type: { $ref: "#/components/schemas/BloodType" }
        age_18_or_older: { type: boolean, description: must be true (FR-01) }
        travel_radius_m: { type: integer, default: 10000 }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    DonorProfile:
      type: object
      properties:
        user_id: { type: integer, format: int64 }
        blood_type: { $ref: "#/components/schemas/BloodType" }
        is_age_eligible: { type: boolean }
        is_available: { type: boolean }
        travel_radius_m: { type: integer }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        last_donation_date: { type: string, format: date, nullable: true }
    UpdateProfileRequest:
      type: object
      description: All fields optional; only those present are changed.
      properties:
        blood_type: { $ref: "#/components/schemas/BloodType" }
        is_available: { type: boolean }
        travel_radius_m: { type: integer }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        last_donation_date: { type: string, format: date }
    ScreeningQuestion:
      type: object
      properties:
        id: { type: string }
        prompt: { type: string }
        flag_answer: { type: boolean, description: the answer that suggests a possible restriction }
    ScreeningRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties: { type: boolean }
          description: one boolean per question id; all questions must be answered
    ScreeningResult:
      type: object
      properties:
        has_flags: { type: boolean }
        guidance: { type: string, description: non-diagnostic guidance; never a decision (FR-04) }
        flagged_question_ids:
          type: array
          items: { type: string }
        submitted_at: { type: string, format: date-time }

    ConcreteBloodType:
      type: string
      description: The 8 concrete red-cell types; requests never use "unknown".
      enum: ["O-","O+","A-","A+","B-","B+","AB-","AB+"]
    RequestStatus:
      type: string
      enum: [pending_approval, approved, fulfilled, cancelled, expired]
    MatchStatus:
      type: string
      enum: [notified, accepted, declined, expired]
    AppointmentStatus:
      type: string
      enum: [scheduled, completed, cancelled, no_show]

    CreateRequest:
      type: object
      required: [blood_type, units_needed]
      properties:
        blood_type: { $ref: "#/components/schemas/ConcreteBloodType" }
        units_needed: { type: integer, minimum: 1 }
        urgency: { type: string, enum: [routine, urgent, critical], default: routine }
        radius_m: { type: integer, default: 10000 }
        latitude: { type: number, format: double, description: defaults to the clinic's location }
        longitude: { type: number, format: double }
        notes: { type: string }
        needed_by: { type: string, format: date-time }
    BloodRequest:
      type: object
      properties:
        id: { type: integer, format: int64 }
        clinic_id: { type: integer, format: int64 }
        created_by: { type: integer, format: int64 }
        blood_type: { $ref: "#/components/schemas/ConcreteBloodType" }
        units_needed: { type: integer }
        urgency: { type: string }
        status: { $ref: "#/components/schemas/RequestStatus" }
        approved_by: { type: integer, format: int64, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        radius_m: { type: integer }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        notes: { type: string, nullable: true }
        needed_by: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ApproveResponse:
      type: object
      properties:
        request: { $ref: "#/components/schemas/BloodRequest" }
        matched_count: { type: integer, description: donors matched by the pipeline }
    RequestMatch:
      type: object
      description: A matched donor from the clinic's perspective (with contact info).
      properties:
        id: { type: integer, format: int64 }
        donor_user_id: { type: integer, format: int64 }
        distance_m: { type: number, format: double, nullable: true }
        status: { $ref: "#/components/schemas/MatchStatus" }
        notified_at: { type: string, format: date-time, nullable: true }
        responded_at: { type: string, format: date-time, nullable: true }
        full_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
    DonorMatch:
      type: object
      description: A match from the donor's perspective (with request context).
      properties:
        id: { type: integer, format: int64 }
        request_id: { type: integer, format: int64 }
        distance_m: { type: number, format: double, nullable: true }
        status: { $ref: "#/components/schemas/MatchStatus" }
        notified_at: { type: string, format: date-time, nullable: true }
        responded_at: { type: string, format: date-time, nullable: true }
        blood_type: { $ref: "#/components/schemas/ConcreteBloodType" }
        urgency: { type: string }
        needed_by: { type: string, format: date-time, nullable: true }
        clinic_id: { type: integer, format: int64 }
        clinic_name: { type: string }
    RespondRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [accept, decline] }
    BookRequest:
      type: object
      required: [scheduled_at]
      properties:
        scheduled_at: { type: string, format: date-time }
    Appointment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        request_id: { type: integer, format: int64 }
        donor_user_id: { type: integer, format: int64 }
        clinic_id: { type: integer, format: int64 }
        scheduled_at: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AppointmentStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [completed, no_show, cancelled] }
    PushTokenRequest:
      type: object
      required: [token, platform]
      properties:
        token: { type: string }
        platform: { type: string, enum: [android, ios, web] }

    CreateClinic:
      type: object
      required: [name]
      properties:
        name: { type: string }
        contact_email: { type: string, format: email }
        contact_phone: { type: string }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
    Clinic:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        contact_email: { type: string, nullable: true }
        contact_phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateMember:
      type: object
      required: [email, password, full_name, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        full_name: { type: string }
        phone: { type: string }
        role: { type: string, enum: [clinic_employee, clinic_admin] }
    ClinicMember:
      type: object
      properties:
        id: { type: integer, format: int64 }
        clinic_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64 }
        role: { type: string, enum: [clinic_employee, clinic_admin] }
        full_name: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
    ActivityLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actor_user_id: { type: integer, format: int64, nullable: true }
        action: { type: string, example: request.approved }
        entity_type: { type: string, nullable: true }
        entity_id: { type: integer, format: int64, nullable: true }
        metadata: { type: object, nullable: true }
        created_at: { type: string, format: date-time }

security:
  - bearerAuth: []
